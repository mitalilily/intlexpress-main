services:
  - type: web
    name: intlexpress-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./client/dist
    buildFilter:
      paths:
        - client/**
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: intlexpress-admin
    runtime: static
    rootDir: admin-dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: ./admin-dashboard/build
    buildFilter:
      paths:
        - admin-dashboard/**

  - type: web
    name: intlexpress-main-pgvy
    runtime: node
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    buildFilter:
      paths:
        - backend/**
